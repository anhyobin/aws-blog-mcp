name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  SERVER_SCHEMA_URL: https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: ruff format
        run: uv run --locked ruff format --check
      - name: ruff check
        run: uv run --locked ruff check --output-format=github
      - name: pyright
        run: uv run --locked pyright

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --locked
      - name: pytest
        run: uv run --locked pytest -q --cov

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Check package metadata
        run: uv run --no-project .github/scripts/check_metadata.py --dist dist
      - name: twine check
        run: uvx twine@7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  server-json:
    name: Validate server.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Validate against the JSON schema
        run: uvx check-jsonschema@0.38.2 --schemafile "$SERVER_SCHEMA_URL" server.json
      - name: Check versions and the README marker
        run: uv run --no-project .github/scripts/check_metadata.py
      - id: mcp-publisher
        uses: $/.github/actions/setup-mcp-publisher
      - name: Validate with mcp-publisher
        env:
          MCP_PUBLISHER: ${{ steps.mcp-publisher.outputs.path }}
        run: '"$MCP_PUBLISHER" validate server.json'
