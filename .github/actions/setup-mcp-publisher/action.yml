name: Set up mcp-publisher
description: >-
  Download a pinned mcp-publisher release (the MCP Registry CLI) for Linux x86-64 and verify its
  SHA-256. The path of the binary is returned in the "path" output.

inputs:
  version:
    description: mcp-publisher release tag
    default: v1.8.1
  sha256:
    description: SHA-256 of mcp-publisher_linux_amd64.tar.gz for that release
    default: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

outputs:
  path:
    description: Absolute path of the mcp-publisher binary
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - name: Download and verify mcp-publisher
      id: install
      shell: bash
      env:
        MCP_PUBLISHER_VERSION: ${{ inputs.version }}
        MCP_PUBLISHER_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS}" != "Linux" || "${RUNNER_ARCH}" != "X64" ]]; then
          echo "::error::setup-mcp-publisher only supports Linux x86-64 runners"
          exit 1
        fi
        install_dir="${RUNNER_TEMP}/mcp-publisher-${MCP_PUBLISHER_VERSION}"
        mkdir -p "${install_dir}"
        archive="${install_dir}/mcp-publisher.tar.gz"
        curl --fail --silent --show-error --location --retry 3 --output "${archive}" \
          "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
        echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
        tar -xzf "${archive}" -C "${install_dir}" mcp-publisher
        "${install_dir}/mcp-publisher" --version
        echo "path=${install_dir}/mcp-publisher" >> "${GITHUB_OUTPUT}"
